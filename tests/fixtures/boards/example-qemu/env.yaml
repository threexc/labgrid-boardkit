imports:
  - strategy.py

targets:
  main:
    drivers:
      QEMUDriver:
        qemu_bin: qemu-system-riscv64
        bios: example-qemu_bios
        kernel: example-qemu_kernel
        cpu: 'rv64'
        memory: "2048"
        machine: 'virt'
        disk: example-qemu_ext4
        boot_args: 'root=/dev/vda rw console=ttyS0'
        extra_args: >-
          -display none
          -device virtio-net-device,netdev=net0,mac=52:54:00:12:35:02
          -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22,hostfwd=tcp:127.0.0.1:2323-:23
          -object rng-random,filename=/dev/urandom,id=rng0
          -device virtio-rng-device,rng=rng0
      ShellDriver:
        prompt: 'root@[a-zA-Z0-9]+:~#\s'
        login_prompt: ' login: '
        username: 'root'
        login_timeout: 300
      QemuBootStrategy: {}

images:
  example-qemu_bios: '/srv/images/example-qemu/fw_jump.elf'
  example-qemu_ext4: '/srv/images/example-qemu/rootfs.ext4'
  example-qemu_kernel: '/srv/images/example-qemu/Image'
